<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>눈을 돌린 사이</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { cursor: default; -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* wordless veil: an eye that opens as the cathedral is built, then waits for a click */
  #veil { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: radial-gradient(ellipse at 50% 46%, #0b0a09 0%, #000 70%); transition: opacity 1.6s ease; z-index: 5; }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil svg { overflow: visible; }
  #eye { width: min(34vmin, 260px); height: auto; }
  #eye .lid { fill: none; stroke: #b9a98c; stroke-width: 1.6; stroke-linecap: round; }
  #eye .iris { fill: none; stroke: #b9a98c; stroke-width: 1.4; transition: opacity .6s; }
  #eye .pupil { fill: #b9a98c; transition: opacity .6s; }
  #eye .ray { stroke: #6f6453; stroke-width: 1.1; stroke-linecap: round; }
  #veil.ready #eye { animation: breathe 3.2s ease-in-out infinite; cursor: pointer; }
  @keyframes breathe { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
  #hint { margin-top: 5vmin; display: flex; gap: 6vmin; opacity: 0; transition: opacity 1.2s ease .3s; }
  #veil.ready #hint { opacity: .55; }
  #hint svg { width: min(9vmin, 64px); height: auto; }
  #hint .s { fill: none; stroke: #8d806a; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  #hint .f { fill: #8d806a; }
  #fail { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 9; }
  #fail svg { width: min(20vmin, 140px); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="veil">
  <svg id="eye" viewBox="-60 -40 120 80" aria-hidden="true">
    <g id="rays"></g>
    <path id="lidTop" class="lid" d="M-46 0 Q0 0 46 0"/>
    <path id="lidBot" class="lid" d="M-46 0 Q0 0 46 0"/>
    <circle class="iris" id="iris" cx="0" cy="0" r="13" opacity="0"/>
    <circle class="pupil" id="pupil" cx="0" cy="0" r="5" opacity="0"/>
  </svg>
  <div id="hint" aria-hidden="true">
    <!-- mouse moving = gaze -->
    <svg viewBox="0 0 64 64">
      <rect class="s" x="22" y="14" width="20" height="34" rx="10"/>
      <line class="s" x1="32" y1="14" x2="32" y2="27"/>
      <path class="s" d="M10 31 l-5 0 m0 0 l4 -4 m-4 4 l4 4"/>
      <path class="s" d="M54 31 l5 0 m0 0 l-4 -4 m4 4 l-4 4"/>
      <path class="s" d="M32 8 l0 -4 m0 0 l-4 4 m4 -4 l4 4" transform="translate(0 2)"/>
      <path class="s" d="M32 54 l0 4 m0 0 l-4 -4 m4 4 l4 -4" transform="translate(0 0)"/>
    </svg>
    <!-- click = blink -->
    <svg viewBox="0 0 64 64">
      <rect class="s" x="6" y="14" width="20" height="34" rx="10"/>
      <path class="f" d="M16 14 a10 10 0 0 0 -10 10 l0 4 l10 0 z"/>
      <path class="s" d="M32 31 l8 0 m0 0 l-3 -3 m3 3 l-3 3"/>
      <path class="s" d="M44 31 Q53 39 62 31"/>
      <path class="s" d="M47 35 l-1.5 3 M53 36.5 l0 3.2 M59 35 l1.5 3"/>
    </svg>
  </div>
</div>

<!-- shown only if WebGL2 is unavailable: a crossed-out eye, still wordless -->
<div id="fail"><svg viewBox="-60 -40 120 80"><path d="M-46 0 Q0 -34 46 0 Q0 34 -46 0Z" fill="none" stroke="#7a5a50" stroke-width="2"/><circle r="11" fill="none" stroke="#7a5a50" stroke-width="2"/><line x1="-40" y1="30" x2="40" y2="-30" stroke="#7a5a50" stroke-width="2.4"/></svg></div>

<script>
/*__THREE__*/
</script>
<script>
(() => {
'use strict';
/*__APP__*/
})();
</script>
</body>
</html>
